x-order-environment: &order-environment
  SPRING_PROFILES_ACTIVE: database
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
  SPRING_DATASOURCE_USERNAME: orders
  SPRING_DATASOURCE_PASSWORD: orders-local-password
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-order-service: &order-service
  image: order-service:session-08
  pull_policy: never
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders-local-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 20

  order-service-a:
    <<: *order-service
    ports:
      - "8080:8080"
    environment:
      <<: *order-environment
      SPRING_KAFKA_LISTENER_CONCURRENCY: "3"
      SPRING_KAFKA_LISTENER_CLIENT_ID: order-service-a

  order-service-b:
    <<: *order-service
    ports:
      - "8081:8080"
    environment:
      <<: *order-environment
      SPRING_KAFKA_LISTENER_CONCURRENCY: "3"
      SPRING_KAFKA_LISTENER_CLIENT_ID: order-service-b

  order-producer:
    <<: *order-service
    ports:
      - "8082:8080"
    environment:
      <<: *order-environment
      SPRING_KAFKA_LISTENER_AUTO_STARTUP: "false"

